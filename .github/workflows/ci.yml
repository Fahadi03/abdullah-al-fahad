name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, typecheck, and check for broken internal links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (used by the OG-image build step)
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Start dev server in the background
        run: npm run dev &

      - name: Wait for the dev server to respond
        run: timeout 60 bash -c 'until curl -sf http://localhost:4321 >/dev/null; do sleep 1; done'

      - name: Check for broken internal links
        run: npm run check:links
